# Project C, regional: Step 3 policy simulations for 11 West African countries.
# RIF, t 1-3 months binned, SSP3-7.0, 2025-2035 and 2040-2060. Each policy runs
# on a model with its variable as the interaction (Fig 10, 11, 14, 15, 18, C5).
# The model, policy and poverty_line axes are zipped (six runs per country):
#   no policy, 3.00           Fig 10
#   cash transfer, 3.00       Fig 18 (bottom 40%, P10, 12 payments, 30% errors)
#   electricity_universal, 3.00      Fig 11
#   water_sanitation_universal     Fig 14
#   educ_secondary_universal       Fig 15
#   no policy, 8.30           Fig C5 (reruns the simulation only)

seed: 123

sample: {unit: hh}

outcome: {name: welfare, currency: PPP}

weather:
  t: {ref_period: [1, 3], form: binned, n_bins: 5, binning_method: Equal frequency}
  hist_years: [1991, 2020]

model:
  type: rif
  fixed_effects: [year, loc_id_panel]
  covariates: {method: lasso}

sim:
  hist_years: [1991, 2020]
  future_periods: [[2025, 2035], [2040, 2060]]
  ssps: [ssp3_7_0]
  coef_uncertainty: false

profiles:
  model:
    rif:      {type: rif}
    rif_elec: {type: rif, interactions: [electricity]}
    rif_ws:   {type: rif, interactions: [imp_wat_san_rec]}
    rif_ed:   {type: rif, interactions: [educ_com2_hh]}
  policy:
    none: {}
    cash_p10:
      sp:
        transfer_amount_mode: pctile
        transfer_pctile: 10
        transfer_n_payments: 12
        targeting: exante_poor
        targeting_threshold_pct: 40
        inclusion_error_pct: 30
        exclusion_error_pct: 30
    elec:      {infra: {electricity_universal: true}}
    ws:        {infra: {water_sanitation_universal: true}}
    secondary: {education: {educ_secondary_universal: true}}

axes:
  country: [BEN, BFA, CIV, GMB, GNB, MLI, MRT, NER, SEN, TCD, TGO]
  model:        [rif,  rif,      rif_elec, rif_ws, rif_ed,    rif]
  policy:       [none, cash_p10, elec,     ws,     secondary, none]
  poverty_line: [3.0,  3.0,      3.0,      3.0,    3.0,       8.3]

zip: [[model, policy, poverty_line]]

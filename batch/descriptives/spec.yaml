# Project A, descriptives: survey and weather statistics for the 21 countries.
# No model section: tables variable_stats, interview_dates, weather_stats.
# Fig 2, Table A1 and F1, Fig A1 to A3, B1, B2, F1.

seed: 123

sample: {unit: hh}

outcome: {name: welfare, currency: PPP}

# stats.indicators keeps the app defaults: poor300, poor420, poor830 (welfare
# below 3.00, 4.20, 8.30) and the travel-time indicators.

weather:
  hist_years: [1991, 2020]

# Weather profiles: one variable and one reference period (months before the
# interview) each.
profiles:
  weather:
    t_1m:        {t: {ref_period: [1, 1], form: continuous}}
    t_3m:        {t: {ref_period: [1, 3], form: continuous}}
    t_6m:        {t: {ref_period: [1, 6], form: continuous}}
    t_12m:       {t: {ref_period: [1, 12], form: continuous}}
    tr_1m:       {tr: {ref_period: [1, 1], form: continuous, temporal_agg: Mean}}
    tr_3m:       {tr: {ref_period: [1, 3], form: continuous, temporal_agg: Mean}}
    tr_6m:       {tr: {ref_period: [1, 6], form: continuous, temporal_agg: Mean}}
    tr_12m:      {tr: {ref_period: [1, 12], form: continuous, temporal_agg: Mean}}
    tx35_1m:     {tx35: {ref_period: [1, 1], form: continuous, temporal_agg: Mean}}
    tx35_3m:     {tx35: {ref_period: [1, 3], form: continuous, temporal_agg: Mean}}
    tx35_6m:     {tx35: {ref_period: [1, 6], form: continuous, temporal_agg: Mean}}
    tx35_12m:    {tx35: {ref_period: [1, 12], form: continuous, temporal_agg: Mean}}
    r_1m:        {r: {ref_period: [1, 1], form: continuous, temporal_agg: Mean}}
    r_3m:        {r: {ref_period: [1, 3], form: continuous, temporal_agg: Mean}}
    r_6m:        {r: {ref_period: [1, 6], form: continuous, temporal_agg: Mean}}
    r_12m:       {r: {ref_period: [1, 12], form: continuous, temporal_agg: Mean}}
    rx5day_1m:   {rx5day: {ref_period: [1, 1], form: continuous, temporal_agg: Mean}}
    rx5day_3m:   {rx5day: {ref_period: [1, 3], form: continuous, temporal_agg: Mean}}
    rx5day_6m:   {rx5day: {ref_period: [1, 6], form: continuous, temporal_agg: Mean}}
    rx5day_12m:  {rx5day: {ref_period: [1, 12], form: continuous, temporal_agg: Mean}}
    spei6_1m:    {spei6: {ref_period: [1, 1], form: continuous}}
    spei6_3m:    {spei6: {ref_period: [1, 3], form: continuous}}
    spei6_6m:    {spei6: {ref_period: [1, 6], form: continuous}}
    spei6_12m:   {spei6: {ref_period: [1, 12], form: continuous}}

axes:
  country: [BEN, BFA, BRA, CIV, COL, GMB, GNB, GTM, IND, IRN, LKA, MLI, MRT, MWI, NER, SEN, TCD, TGO, TJK, VNM, ZMB]
  weather: [t_1m, t_3m, t_6m, t_12m, tr_1m, tr_3m, tr_6m, tr_12m, tx35_1m, tx35_3m, tx35_6m, tx35_12m, r_1m, r_3m, r_6m, r_12m, rx5day_1m, rx5day_3m, rx5day_6m, rx5day_12m, spei6_1m, spei6_3m, spei6_6m, spei6_12m]
